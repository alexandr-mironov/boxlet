<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boxlet</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body {
    font: 14px/1.5 -apple-system, "SF Pro Text", system-ui, sans-serif;
    background: #0d1117; color: #e6edf3; padding: 24px; max-width: 900px; margin: 0 auto;
  }
  h1 { font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; }
  .running { background: #1a7f37; }
  .stopped { background: #6e7681; }
  .error   { background: #cf222e; }
  section { margin-top: 24px; background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 16px; }
  h2 { font-size: 14px; color: #8b949e; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 12px; }
  button {
    font: inherit; padding: 6px 16px; border-radius: 8px; border: 1px solid #30363d;
    background: #21262d; color: inherit; cursor: pointer;
  }
  button:hover { background: #2d333b; }
  button.danger:hover { border-color: #cf222e; }
  select {
    font: inherit; padding: 5px 10px; border-radius: 8px; border: 1px solid #30363d;
    background: #21262d; color: inherit;
  }
  table { width: 100%; border-collapse: collapse; }
  td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #21262d; font-size: 13px; }
  .muted { color: #8b949e; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12px; }
  pre.logs {
    background: #0d1117; border: 1px solid #21262d; border-radius: 8px;
    padding: 10px; max-height: 320px; overflow: auto; white-space: pre-wrap;
    word-break: break-all; font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; line-height: 1.45;
  }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .grow { flex: 1; }
  #metrics { margin-top: 8px; }
</style>
</head>
<body>
  <h1>Boxlet <span id="badge" class="badge stopped">…</span></h1>

  <section>
    <h2>Движок</h2>
    <p id="engine" class="muted">загрузка…</p>
    <p id="metrics" class="muted mono"></p>
    <p class="row" style="margin-top:10px">
      <button onclick="action('start')">Старт</button>
      <button onclick="action('stop')">Стоп</button>
      <button class="danger" onclick="restart()">Рестарт</button>
      <span class="grow"></span>
      <button onclick="refresh()">Обновить</button>
    </p>
    <p class="muted mono" style="margin-top:10px">Docker API: <span id="sock"></span></p>
  </section>

  <section>
    <h2>Контейнеры</h2>
    <div id="containers" class="muted">—</div>
  </section>

  <section>
    <h2>Логи</h2>
    <p class="row" style="margin-bottom:10px">
      <select id="logname" onchange="refreshLogs()">
        <option value="daemon">демон (boxletd)</option>
        <option value="vm">VM (serial)</option>
        <option value="helper">хелпер VM</option>
        <option value="priv">boxlet-priv</option>
        <option value="dockerd">dockerd (гость)</option>
        <option value="agent">агент (гость)</option>
      </select>
      <label class="muted" style="font-size:13px">
        <input type="checkbox" id="logfollow" checked> следить
      </label>
      <span class="grow"></span>
      <button onclick="refreshLogs()">Обновить</button>
    </p>
    <pre id="logs" class="logs muted">—</pre>
  </section>

<script>
document.getElementById('sock').textContent = '~/.boxlet/run/docker.sock';
let restarting = false;

async function refresh() {
  try {
    const st = await (await fetch('/api/status')).json();
    const badge = document.getElementById('badge');
    badge.textContent = st.state;
    badge.className = 'badge ' + (st.running ? 'running' : (st.state === 'error' ? 'error' : 'stopped'));
    document.getElementById('engine').textContent =
      'бэкенд: ' + st.backend + (st.detail ? ' — ' + st.detail : '');
    if (st.running) {
      if (restarting) { restarting = false; }
      refreshMetrics();
    } else {
      document.getElementById('metrics').textContent =
        restarting ? 'рестарт: движок остановлен, ждём запуска…' : '';
    }
  } catch (e) {
    document.getElementById('engine').textContent = 'демон недоступен: ' + e;
  }
  try {
    const list = await (await fetch('/api/containers')).json();
    const box = document.getElementById('containers');
    if (!list || !list.length) { box.textContent = 'контейнеров нет'; return; }
    box.innerHTML = '<table><tr><th>Имя</th><th>Образ</th><th>Статус</th><th>Порты</th></tr>' +
      list.map(c => '<tr><td class="mono">' + esc((c.Names?.[0] || '').replace(/^\//, '')) +
        '</td><td class="mono">' + esc(c.Image) + '</td><td>' + esc(c.Status) +
        '</td><td class="mono">' + (c.Ports || []).map(p => (p.PublicPort ? p.PublicPort + '→' : '') + p.PrivatePort).join(', ') +
        '</td></tr>').join('') + '</table>';
  } catch (e) {
    document.getElementById('containers').textContent = 'docker API недоступен (движок остановлен?)';
  }
}

async function refreshMetrics() {
  try {
    const resp = await fetch('/api/metrics');
    if (!resp.ok) { document.getElementById('metrics').textContent = ''; return; }
    const m = await resp.json();
    let s = 'load ' + (m.load || '—');
    if (m.mem_total_mib > 0) s += ', RAM ' + m.mem_used_mib + '/' + m.mem_total_mib + ' MiB занято';
    document.getElementById('metrics').textContent = s;
  } catch (e) { /* метрики опциональны */ }
}

async function refreshLogs() {
  const name = document.getElementById('logname').value;
  const box = document.getElementById('logs');
  try {
    const resp = await fetch('/api/logs?name=' + encodeURIComponent(name) + '&tail=300');
    const text = await resp.text();
    box.classList.remove('muted');
    box.textContent = resp.ok ? (text.trimEnd() || '(пусто)') : text;
    box.scrollTop = box.scrollHeight;
  } catch (e) {
    box.textContent = 'логи недоступны: ' + e;
  }
}

async function action(name) {
  await fetch('/api/' + name, { method: 'POST' });
  setTimeout(refresh, 500);
}

async function restart() {
  if (!confirm('Перезапустить движок? Контейнеры будут остановлены.')) return;
  restarting = true;
  await fetch('/api/restart', { method: 'POST' });
  setTimeout(refresh, 1000);
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

refresh();
refreshLogs();
setInterval(refresh, 3000);
setInterval(() => { if (document.getElementById('logfollow').checked) refreshLogs(); }, 3000);
</script>
</body>
</html>
